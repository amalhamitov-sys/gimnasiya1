<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планировка школы — МОБУ гимназия №1</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#hs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.hs button{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:rgba(37,99,235,.8);color:#fff;font-size:28px;cursor:pointer;transform:perspective(220px) rotateX(50deg);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hs span{font-size:12px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:10px;margin-top:2px;white-space:nowrap}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 20px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
#bar b{margin-right:auto;cursor:pointer}
button.p{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
#list{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:12px;max-height:60%;overflow:auto;background:rgba(15,20,35,.94);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px}
#list button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;font:inherit;border-radius:8px;cursor:pointer}
#list button.on{background:#2563eb}
#msg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 14px;border-radius:10px;font-size:14px;white-space:nowrap}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:radial-gradient(circle at 30% 20%,#2b5fd9 0,#152a5c 55%,#0b1633 100%)}
#start .k{letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:.75}
#start .ic{font-size:64px;line-height:1}
#start h1{margin:0;font-size:clamp(30px,7vw,56px);line-height:1.15}
#start h1 span{display:block;font-size:.55em;font-weight:500;opacity:.92;margin-top:.5em}
#start p{margin:0;max-width:420px;opacity:.8;font-size:14px;line-height:1.5}
#start .go{background:#fff;color:#152a5c;font-size:16px;font-weight:600;padding:12px 26px;border:0;border-radius:10px;cursor:pointer;margin-top:10px}
#note{color:#ffd28a;font-size:13px;max-width:420px}
[hidden]{display:none!important}
</style></head><body>
<canvas id="c"></canvas><div id="hs"></div>
<div id="bar"><b id="home">🏫 МОБУ гимназия №1</b><button class="p" id="menu">☰ Комнаты</button></div>
<div id="list" hidden></div>
<div id="msg" hidden></div>
<div id="start">
  <div class="ic">🏫</div><div class="k">Виртуальная прогулка</div>
  <h1>Планировка школы<span>МОБУ гимназия номер 1</span></h1>
  <p>Гуляй по школе в формате 360°: крути панораму мышью или пальцем и переходи между кабинетами по стрелкам.</p>
  <button class="go" id="go">Начать прогулку →</button>
  <div id="note" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T={scenes:[]},cur=null,lon=0,lat=0,fov=75,hsEls=[],d=null;
const canvas=$('#c'),hsBox=$('#hs'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(fov,1,1,1100);
const geo=new THREE.SphereGeometry(500,60,40);geo.scale(-1,1,1);
const mat=new THREE.MeshBasicMaterial({color:0x222222});scene.add(new THREE.Mesh(geo,mat));
const vec=(lo,la,r)=>{const p=(90-la)*Math.PI/180,t=lo*Math.PI/180;return new THREE.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const tmp=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);
  lat=Math.max(-85,Math.min(85,lat));camera.fov=fov;camera.updateProjectionMatrix();
  camera.lookAt(vec(lon,lat,500));camera.updateMatrixWorld();renderer.render(scene,camera);
  const dir=camera.getWorldDirection(tmp).clone();
  for(const el of hsEls){const p=el._p.clone();
    if(p.dot(dir)<=0){el.style.display='none';continue}
    p.project(camera);el.style.display='';el.style.left=(p.x+1)/2*innerWidth+'px';el.style.top=(1-p.y)/2*innerHeight+'px'}
})();
canvas.addEventListener('pointerdown',e=>{d={x:e.clientX,y:e.clientY,lo:lon,la:lat};canvas.setPointerCapture(e.pointerId);$('#list').hidden=true});
canvas.addEventListener('pointermove',e=>{if(!d)return;const k=fov/75*0.12;lon=d.lo-(e.clientX-d.x)*k;lat=d.la+(e.clientY-d.y)*k});
canvas.addEventListener('pointerup',()=>d=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(30,Math.min(100,fov+e.deltaY*0.05))},{passive:false});
function go(file){const s=T.scenes.find(x=>x.file===file);if(!s)return;cur=s;
  hsBox.innerHTML='';hsEls=[];$('#msg').hidden=false;$('#msg').textContent='Загрузка…';$('#list').hidden=true;
  [...$('#list').children].forEach(b=>b.classList.toggle('on',b.dataset.f===file));
  const L=new THREE.TextureLoader(),u=encodeURIComponent(s.file),ok=t=>{
    if(cur!==s)return;mat.color.set(0xffffff);t.encoding=THREE.sRGBEncoding;if(mat.map)mat.map.dispose();mat.map=t;mat.needsUpdate=true;
    $('#msg').textContent=s.name;
    (s.hotspots||[]).forEach(h=>{const to=T.scenes.find(x=>x.file===h.to);if(!to)return;
      const el=document.createElement('div');el.className='hs';el._p=vec(h.lon,h.lat,400);
      el.innerHTML=`<button title="${esc(to.name)}">↑</button><span>${esc(to.name)}</span>`;
      el.firstChild.onclick=()=>go(to.file);hsBox.append(el);hsEls.push(el)});
  };
  L.load('panoramas/'+u,ok,undefined,()=>L.load(u,ok,undefined,()=>{if(cur===s){mat.map=null;mat.needsUpdate=true;$('#msg').textContent='Нет фото: '+s.file}}))}
$('#menu').onclick=e=>{e.stopPropagation();$('#list').hidden=!$('#list').hidden};
$('#home').onclick=()=>$('#start').hidden=false;
$('#go').onclick=()=>{if(!T.scenes.length){$('#note').hidden=false;return}$('#start').hidden=true;if(!cur)go(T.scenes[0].file)};
fetch('tour.json').then(r=>r.json()).then(t=>{T=t;
  $('#list').innerHTML=T.scenes.map(s=>`<button data-f="${esc(s.file)}">${esc(s.name)}</button>`).join('');
  [...$('#list').children].forEach(b=>b.onclick=()=>go(b.dataset.f));
  if(!T.scenes.length){$('#note').hidden=false;$('#note').textContent='В tour.json пока нет комнат — собери тур в редакторе.'}
}).catch(()=>{$('#note').hidden=false;$('#note').textContent='Не удалось загрузить tour.json. Открой сайт по ссылке GitHub Pages или через локальный сервер (см. README).'});
</script></body></html>
